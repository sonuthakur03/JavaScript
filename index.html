<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My JavaScript Projects</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
            dark: '#1E293B',
          }
        }
      }
    }
  </script>
  <style>
    .project-card:hover .project-title {
      color: #3B82F6;
    }
    .project-card:hover img {
      transform: scale(1.05);
    }
    .nav-transition {
      transition: all 0.3s ease;
    }
    .social-icon:hover {
      transform: translateY(-3px);
      color: #3B82F6 !important;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <!-- Navigation Bar -->
  <nav class="bg-white shadow-md nav-transition sticky top-0 z-50">
    <div class="container mx-auto px-4">
      <div class="flex justify-between items-center py-4">
        <div class="flex items-center space-x-4">
          <a href="#" class="text-2xl font-bold text-dark hover:text-primary">
            <i class="fas fa-code mr-2"></i>DevPortfolio
          </a>
        </div>
        
        <div class="hidden md:flex items-center space-x-8">
          <a href="#projects" class="text-gray-700 hover:text-primary font-medium">Projects</a>
          <a href="#about" class="text-gray-700 hover:text-primary font-medium">About</a>
          <a href="https://github.com/sonuthakur03" target="_blank" class="flex items-center text-gray-700 hover:text-primary">
            <i class="fab fa-github mr-2"></i> GitHub
          </a>
        </div>
        
        <!-- Mobile menu button -->
        <button id="mobile-menu-button" class="md:hidden text-gray-700">
          <i class="fas fa-bars text-xl"></i>
        </button>
      </div>
      
      <!-- Mobile Menu -->
      <div id="mobile-menu" class="hidden md:hidden pb-4">
        <a href="#projects" class="block py-2 text-gray-700 hover:text-primary">Projects</a>
        <a href="#about" class="block py-2 text-gray-700 hover:text-primary">About</a>
        <a href="https://github.com/sonuthakur03" target="_blank" class="block py-2 text-gray-700 hover:text-primary">
          <i class="fab fa-github mr-2"></i> GitHub
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow container mx-auto px-4 py-12">
    <!-- Header -->
    <header class="text-center mb-16" id="about">
      <h1 class="text-4xl md:text-5xl font-bold text-dark mb-4">My JavaScript Projects</h1>
      <p class="text-lg text-gray-600 max-w-2xl mx-auto">
        A collection of interactive web applications built with HTML, CSS, and JavaScript
      </p>
    </header>

    <!-- Projects Grid -->
    <section id="projects">
      <h2 class="text-3xl font-bold text-dark mb-8 text-center">Featured Projects</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" id="projects-container">
        <!-- Projects will be injected here by JavaScript -->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white py-12">
    <div class="container mx-auto px-4">
      <div class="flex flex-col md:flex-row justify-between items-center">
        <div class="mb-6 md:mb-0">
          <h3 class="text-2xl font-bold mb-4">sonuthakur03</h3>
          <p class="text-gray-400">Full-stack JavaScript developer</p>
        </div>
        
        <div class="flex flex-col items-center md:items-end">
          <div class="flex space-x-6 mb-6">
            <a href="https://github.com/sonuthakur03" target="_blank" class="social-icon text-gray-400 hover:text-white text-2xl transition-all">
              <i class="fab fa-github"></i>
            </a>
            <a href="https://twitter.com/yourprofile" target="_blank" class="social-icon text-gray-400 hover:text-white text-2xl transition-all">
              <i class="fab fa-twitter"></i>
            </a>
            <a href="https://linkedin.com/in/yourprofile" target="_blank" class="social-icon text-gray-400 hover:text-white text-2xl transition-all">
              <i class="fab fa-linkedin"></i>
            </a>
            <a href="mailto:your@email.com" class="social-icon text-gray-400 hover:text-white text-2xl transition-all">
              <i class="fas fa-envelope"></i>
            </a>
          </div>
          <p class="text-gray-500 text-sm">© 2023 All rights reserved</p>
        </div>
      </div>
    </div>
  </footer>

  <script>
    // Project data
    const projects = [
      {
        title: "Tic Tac Toe",
        path: "tic-tac-toe",
        description: "Classic game with responsive design",
        tags: ["Game", "Interactive"],
        image: "tic-tac-toe/screenshot.png"
      },
      {
        title: "Weather Dashboard",
        path: "weather-dashboard",
        description: "Real-time weather forecasts",
        tags: ["API", "Weather"],
        image: "weather-dashboard/screenshot.png"
      },
      {
        title: "Text Reader",
        path: "text-read-speak/dist",
        description: "Text-to-speech application",
        tags: ["Web Speech API", "Accessibility"],
        image: "text-read-speak/screenshot.png"
      },
      {
        title: "To-Do App",
        path: "todo-app",
        description: "Task management application",
        tags: ["CRUD", "Productivity"],
        image: "todo-app/screenshot.png"
      },
      {
        title: "Color Changer",
        path: "color-changer",
        description: "Interactive color palette generator",
        tags: ["Design", "Colors"],
        image: "color-changer/screenshot.png"
      },
      {
        title: "Calculator",
        path: "calculator",
        description: "Functional calculator with themes",
        tags: ["Math", "Utility"],
        image: "calculator/screenshot.png"
      }
    ];

    // Render projects
    const container = document.getElementById('projects-container');
    
    projects.forEach(project => {
      const projectCard = document.createElement('a');
      projectCard.href = `/${project.path}`;
      projectCard.className = 'project-card block bg-white rounded-xl shadow-md overflow-hidden transition-all duration-300 hover:shadow-lg';
      projectCard.innerHTML = `
        <div class="h-48 overflow-hidden">
          <img src="${project.image || 'https://via.placeholder.com/600x400?text=Project+Screenshot'}" 
               alt="${project.title}" 
               class="w-full h-full object-cover transition-transform duration-300">
        </div>
        <div class="p-6">
          <h3 class="project-title text-xl font-semibold text-dark mb-2 transition-colors duration-300">${project.title}</h3>
          <p class="text-gray-600 mb-4">${project.description}</p>
          <div class="flex flex-wrap gap-2">
            ${project.tags.map(tag => `<span class="px-3 py-1 bg-gray-100 text-gray-800 text-sm rounded-full">${tag}</span>`).join('')}
          </div>
        </div>
      `;
      container.appendChild(projectCard);
    });

    // Mobile menu toggle
    const mobileMenuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    
    mobileMenuButton.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });

    // Scroll behavior for navigation
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        document.querySelector(this.getAttribute('href')).scrollIntoView({
          behavior: 'smooth'
        });
      });
    });

    
  </script>
</body>
</html>
